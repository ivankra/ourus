# Publishes to npm on a version tag (`v0.1.0`): the tag checked against package.json's version,
# `npm test` against the commit before it, then `npm publish`, which builds `dist/` (prepack).
# Trusted publishing: npm takes this workflow's identity (OIDC), no token stored, and records
# provenance, the commit and workflow the package was built from. Needs, on npmjs.com, the package's
# Settings → Trusted publisher: GitHub Actions, ivankra/ourus, workflow release.yml.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag is package.json's version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          TEST_BASE_REV: HEAD~1
      - run: npm publish --provenance --access public
