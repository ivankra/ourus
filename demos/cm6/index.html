<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>ourus</title>
    <link rel="stylesheet" href="./dist/main.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;icon_names=format_indent_decrease,format_indent_increase,keyboard_return,redo,undo,vertical_align_bottom,vertical_align_top&amp;display=block" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1><a href="https://github.com/ivankra/ourus">ourus</a></h1>
      <span class="pickers">
        <label>Flavor
          <select id="flavor">
            <option value="obsidian">Obsidian</option>
            <option value="gfm">GFM</option>
            <option value="commonmark">CommonMark</option>
          </select>
        </label>
        <label>Renderer
          <select id="renderer">
            <option value="ourus">ourus</option>
            <option value="commonmark">commonmark.js</option>
            <option value="markdown-it">markdown-it</option>
            <option value="marked">marked</option>
            <option value="micromark">micromark</option>
            <option value="remark">remark</option>
            <option value="showdown">showdown</option>
            <option value="none">(off)</option>
          </select>
        </label>
      </span>
    </header>
    <main>
      <div id="editor"></div>
      <section id="preview-pane">
        <h2 id="preview-title">Rendered</h2>
        <div id="preview"></div>
      </section>
      <aside>
        <h2>Outline</h2>
        <div id="outline"></div>
      </aside>
    </main>
    <footer>
      <span id="status"></span>
      <span id="stats"></span>
    </footer>
    <nav id="keys">
      <button class="material-symbols-outlined" data-command="outdent" title="Outdent" aria-label="Outdent">format_indent_decrease</button>
      <button class="material-symbols-outlined" data-command="indent" title="Indent" aria-label="Indent">format_indent_increase</button>
      <button class="material-symbols-outlined" data-command="moveSubtreeUp" title="Move up" aria-label="Move up">vertical_align_top</button>
      <button class="material-symbols-outlined" data-command="moveSubtreeDown" title="Move down" aria-label="Move down">vertical_align_bottom</button>
      <button class="material-symbols-outlined" data-command="shiftEnter" title="Line break" aria-label="Line break">keyboard_return</button>
      <button class="material-symbols-outlined" data-history="undo" title="Undo" aria-label="Undo">undo</button>
      <button class="material-symbols-outlined" data-history="redo" title="Redo" aria-label="Redo">redo</button>
    </nav>
    <script src="./dist/main.js"></script>
  </body>
</html>
