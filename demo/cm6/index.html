<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ourus · CM6 demo</title>
    <link rel="stylesheet" href="./dist/main.css" />
    <style>
      :root {
        --bg: #fbfbfa;
        --fg: #1f2328;
        --muted: #6e7781;
        --line: #e4e4e0;
        --accent: #3b6fd8;
        --head: #e9f0fd;
        --sub: #f4f7fd;
        --bad: #b42318;
        --good: #1a7f37;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; }
      header h1 { font-size: 16px; margin: 0; }
      header .keys { color: var(--muted); font-size: 13px; }
      header .pickers { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
      header select { font: inherit; color: var(--fg); background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; margin-left: 4px; }
      kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(240px, 340px); height: calc(100vh - 92px); }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #editor { height: 60vh; } }
      #editor { overflow: auto; border-right: 1px solid var(--line); background: #fff; }
      #editor .cm-editor { height: 100%; }
      #editor .cm-scroller { font: 14px/1.6 ui-monospace, 'SF Mono', Menlo, monospace; }
      .ourus-head { background: var(--head); }
      .ourus-subtree { background: var(--sub); }
      aside { overflow: auto; padding: 8px 12px; }
      #preview-pane { overflow: auto; padding: 8px 16px; border-right: 1px solid var(--line); background: #fff; }
      #preview { line-height: 1.55; }
      #preview > :first-child { margin-top: 0; }
      #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { line-height: 1.25; margin: 1em 0 0.4em; }
      #preview h1 { font-size: 1.6em; } #preview h2 { font-size: 1.35em; } #preview h3 { font-size: 1.15em; }
      #preview p { margin: 0.4em 0; }
      #preview ul, #preview ol { margin: 0.3em 0; padding-left: 1.4em; }
      #preview li > p { margin: 0.2em 0; }
      #preview blockquote { margin: 0.5em 0; padding: 0 0.9em; color: var(--muted); border-left: 3px solid var(--line); }
      #preview pre { background: var(--sub); padding: 8px 10px; border-radius: 4px; overflow: auto; }
      #preview code { font: 13px ui-monospace, 'SF Mono', Menlo, monospace; }
      #preview :not(pre) > code { background: var(--sub); padding: 0 3px; border-radius: 3px; }
      #preview hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
      #preview a { color: var(--accent); text-decoration: none; }
      #preview a:hover { text-decoration: underline; }
      #preview table { border-collapse: collapse; margin: 0.5em 0; }
      #preview th, #preview td { border: 1px solid var(--line); padding: 2px 8px; }
      #preview th { background: var(--sub); }
      #preview li:has(> input[type='checkbox']), #preview li:has(> p > input[type='checkbox']), #preview li.task-list-item { list-style: none; }
      #preview li > input[type='checkbox'], #preview li > p > input[type='checkbox'] { margin: 0 0.4em 0 -1.3em; vertical-align: -1px; }
      #preview mark { background: #fff3a3; padding: 0 2px; border-radius: 2px; }
      #preview a.tag { background: #eef1fb; border-radius: 10px; padding: 0 6px; font-size: 0.92em; }
      #preview a.internal-link { color: #7a4cc2; }
      #preview .internal-embed::before { content: '⧉ ' attr(src); color: #7a4cc2; font-size: 0.92em; }
      #preview .katex-display { margin: 0.6em 0; }
      #preview .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #preview pre code.hljs { background: none; padding: 0; }
      #preview .callout { margin: 0.6em 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--sub); border-radius: 4px; }
      #preview .callout-title { font-weight: 600; color: var(--accent); }
      #preview .callout[data-callout='tip'], #preview .callout[data-callout='success'] { border-color: var(--good); background: #f1f8f3; }
      #preview .callout[data-callout='tip'] .callout-title, #preview .callout[data-callout='success'] .callout-title { color: var(--good); }
      #preview .callout[data-callout='warning'], #preview .callout[data-callout='danger'] { border-color: var(--bad); background: #fdf3f2; }
      #preview .callout[data-callout='warning'] .callout-title, #preview .callout[data-callout='danger'] .callout-title { color: var(--bad); }
      #preview .callout-content > :first-child { margin-top: 0.2em; }
      #preview sup.footnote-inline { color: var(--muted); }
      #preview section.footnotes, #preview .footnotes { margin-top: 1.5em; padding-top: 0.5em; border-top: 1px solid var(--line); font-size: 0.92em; color: var(--muted); }
      aside h2, #preview-pane > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 4px 0 8px; }
      #outline ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px solid var(--line); }
      #outline > ul { padding-left: 0; border-left: 0; }
      #outline .node { display: flex; gap: 6px; align-items: baseline; padding: 1px 6px; border-radius: 4px; cursor: pointer; }
      #outline .node:hover { background: var(--sub); }
      #outline .node.current { background: var(--head); outline: 1px solid #c5d6f6; }
      #outline .kind { font: 11px ui-monospace, monospace; color: var(--accent); min-width: 2.2em; }
      #outline .kind-atom { color: var(--muted); }
      #outline .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #outline .id { font: 11px ui-monospace, monospace; color: var(--muted); }
      #outline .placeholders .text { color: var(--muted); }
      #outline .placeholders .text::after { content: ' ◌ placeholders'; font-size: 11px; }
      footer { height: 36px; padding: 8px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 13px; }
      #status { color: var(--muted); }
      #status.applied { color: var(--good); }
      #status.rejected { color: var(--bad); }
      #stats { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>ourus · CodeMirror 6</h1>
      <span class="pickers">
        <label>Flavor
          <select id="flavor">
            <option value="obsidian">Obsidian</option>
            <option value="gfm">GFM</option>
            <option value="commonmark">CommonMark</option>
          </select>
        </label>
        <label>Renderer
          <select id="renderer">
            <option value="ourus">ourus</option>
            <option value="commonmark">commonmark.js</option>
            <option value="markdown-it">markdown-it</option>
            <option value="marked">marked</option>
            <option value="micromark">micromark</option>
            <option value="remark">remark</option>
            <option value="showdown">showdown</option>
          </select>
        </label>
      </span>
      <span class="keys">
        <kbd>Tab</kbd>/<kbd>Shift-Tab</kbd> indent · <kbd>Alt-↑</kbd>/<kbd>Alt-↓</kbd> move ·
        <kbd>Enter</kbd> split · <kbd>Shift-Enter</kbd> line break · <kbd>Backspace</kbd> at start joins · <kbd>Home</kbd> text start, again line start ·
        <kbd>Ctrl-V</kbd> paste as nodes · <kbd>Ctrl-Shift-V</kbd> paste as text
      </span>
    </header>
    <main>
      <div id="editor"></div>
      <section id="preview-pane">
        <h2 id="preview-title">Rendered</h2>
        <div id="preview"></div>
      </section>
      <aside>
        <h2>Outline</h2>
        <div id="outline"></div>
      </aside>
    </main>
    <footer>
      <span id="status">Ready.</span>
      <span id="stats"></span>
    </footer>
    <script src="./dist/main.js"></script>
  </body>
</html>
